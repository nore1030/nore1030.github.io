description\":\"通过古诗学习寒食、中秋等传统节日习俗，并理解诗人的思乡情怀与志向。\",\"difficulty\":3,\"question_types\":[\"默写\",\"解释词义\",\"简答\"]}],\"examLessonId\":\"chinese-g6down-u1-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"详写与略写的处理技巧\",\"core_concept\":\"这是六年级习作的核心。即在写作前确立中心思想，凡是极能表现中心的内容要“浓墨重彩”详写，通过细节描写让内容生动；凡是与中心关系稍远但必须交代的则“一笔带过”略写。如《北京的春节》中，为了表现热闹，详写除夕、元宵，略写正月初六后的日子。\",\"key_formula\":\"详写＝动作＋对话＋心理＋环境；略写＝概述＋短句。\",\"common_mistakes\":[\"记流水账，眉毛胡子一把抓，每个环节字数一样多\",\"错把次要内容当成主要的写，导致偏题\"],\"tips\":\"写作前列提纲，在重点项后面打星号，时刻提醒自己这一段要写具体。\"},{\"point\":\"按时间顺序记叙的方法\",\"core_concept\":\"以时间的推移为线索，串联起生活中的点滴。优点是条理清晰，符合逻辑。在《北京的春节》中，作者使用了表示时间的词（腊八、腊月二十三、除夕、初一）作为每一阶段开头的信号，让读者一眼就能看清民俗的发展过程。\",\"key_formula\":\"时间词语（信号点）+ 当日典型活动 = 清晰脉络。\",\"common_mistakes\":[\"时间衔接词缺失，导致内容跳跃断片\",\"时间概念模糊，逻辑倒置\"],\"tips\":\"可以先画一个时间轴，标注出关键时间点，再往里面填充具体的内容。\"},{\"point\":\"细节描写与侧面描写\",\"core_concept\":\"细节描写是对细小动作、神态或事物特征的精准刻画，如《腊八粥》中对大锅里粥“叹气”的描写。侧面描写则是不直接写对象，而是通过观察者的感受、周围环境的反应来衬托，如通过八儿的流口水来衬托腊八粥的好喝。\",\"key_formula\":\"侧面描写：甲太好→所以乙的表现/环境的变化非常大。\",\"common_mistakes\":[\"描写平淡，只会用‘很好吃’、‘很漂亮’等笼统词汇\",\"分不清什么是修辞，什么是生动的描写\"],\"tips\":\"多用‘五感法’（视觉、听觉、嗅觉、味觉、触觉）和‘衬托法’。\"},{\"point\":\"“先总后分”的逻辑结构\",\"core_concept\":\"一种经典的说明或叙事结构。开头部分用概括性的语言（甚至是反问、排比等修辞句）点明事物的核心特征或文章主旨，起到‘总领全文’的作用，后面再分设段落分别从不同角度详细论证或描述。\",\"key_formula\":\"总（全貌/观点）+ 分1（特征A）+ 分2（特征B）+ 分3（特征C）。\",\"common_mistakes\":[\"总起句与后面分述的内容不匹配\",\"分述部分之间逻辑混乱，没有并列关系\"],\"tips\":\"背诵《藏戏》开头的三段，感受其先声夺人的气势和逻辑。\"},{\"point\":\"节日文化与托物言志\",\"core_concept\":\"学习传统文学中的民俗背景。通过古诗中提到的特定物像（如禁烟火、银河、桂花），联想到对应的节日（寒食、七夕、中秋），并体会诗人借这些景象表达出的对家乡、对亲人或对自己处境的复杂情感。\",\"key_formula\":\"物像（如明月）+ 节日场景 = 诗人情感（如思乡）。\",\"common_mistakes\":[\"死记硬背诗句，不理解背后的节日背景\",\"混淆不同节日的特定象征物，如把吃端午粽子记成春节\"],\"tips\":\"建立一张‘节日-日期-习俗-古诗’的对照表，辅助联想记忆。\"}]}]\n"])</script></body></html>
