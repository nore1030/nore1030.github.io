之几的问题\",\"description\":\"解决涉及数量增减变化的分数应用题，理解1±分率的数量关系。\",\"difficulty\":4,\"question_types\":[\"应用题\",\"选择\",\"判断\"]}],\"examLessonId\":\"g6up-u1-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"分数乘整数的意义与计算\",\"core_concept\":\"分数乘整数表示求几个相同分数的和的简便运算，或者是求一个整数的几分之几是多少。计算时，只需用分子与整数相乘的积作为分子，分母保持不变。在计算过程中，能约分的可以先约分，使计算简便。\",\"key_formula\":\"$$\\\\frac{a}{b} \\\\times n = \\\\frac{a \\\\times n}{b}$\",\"common_mistakes\":[\"错误地用分母与整数相乘\",\"忘记约分导致结果不是最简分数\"],\"tips\":\"记住“分子乘整数，分母不动”的原则，看到大数字先看能不能约分。\"},{\"point\":\"分数乘分数的计算法则\",\"core_concept\":\"分数乘分数，用分子相乘的积作为新的分子，分母相乘的积作为新的分母。这代表求一个分数的几分之几是多少。计算结果必须是最简分数。\",\"key_formula\":\"$$\\\\frac{a}{b} \\\\times \\\\frac{c}{d} = \\\\frac{a \\\\times c}{b \\\\times d}$\",\"common_mistakes\":[\"将分子与分母相加而非相乘\",\"交叉约分时出错，如分子与分子约分\"],\"tips\":\"遵循“上乘上，下乘下”，计算前先交叉约分可以大大降低出错率。\"},{\"point\":\"求一个数的几分之几是多少\",\"core_concept\":\"这是分数乘法最核心的应用。将这个“数”看作单位“1”，用单位“1”的具体量乘以它所对应的分率，即可得到该分率对应的具体数量。如果涉及连续求一个数的几分之几，则连续相乘。\",\"key_formula\":\"单位“1”的量 $\\\\times$ 分率 = 对应数量\",\"common_mistakes\":[\"找错单位“1”\",\"分不清什么是量（带单位），什么是率（不带单位）\"],\"tips\":\"找关键字，比如“的”字前面的量通常就是单位“1”。\"},{\"point\":\"分数乘法混合运算与简便计算\",\"core_concept\":\"分数乘法混合运算的顺序与整数一致：先乘除后加减，有括号先算括号。整数的运算定律（交换律、结合律、分配律）在分数运算中同样有效，能使计算变得非常快捷。\",\"key_formula\":\"$$a \\\\times (b + c) = a \\\\times b + a \\\\times c$\",\"common_mistakes\":[\"分配律带符号错误，如括号里是减号却用了加号\",\"计算顺序颠倒\"],\"tips\":\"观察题目，如果有括号且括弧外的数是分母的公倍数，优先考虑分配律。\"},{\"point\":\"比一个数多/少几分之几的问题\",\"core_concept\":\"这类问题是在单位“1”的基础上进行增减。求比一个数多几分之几用 $1 + \\\\frac{a}{b}$，求少几分之几用 $1 - \\\\frac{a}{b}$。然后再用单位“1”乘以这个新的总分率。\",\"key_formula\":\"$$单位“1” \\\\times (1 \\\\pm \\\\frac{a}{b})$\",\"common_mistakes\":[\"忽略了“比...多”中的“1”，直接用单位“1”乘以分率\",\"多与少的运算符号搞混\"],\"tips\":\"先把“多几分之几”转化成“是单位1的几分之几”，即 $(1 + 分率)$。\"}]}]\n"])</script></body></html>
