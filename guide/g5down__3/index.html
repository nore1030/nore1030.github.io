":2,\"question_types\":[\"填空\",\"排序/比较\"]},{\"name\":\"长方体和正方体体积公式应用\",\"description\":\"掌握V=abh, V=a³及通用公式V=Sh，解决实际生活中的方量计算。\",\"difficulty\":3,\"question_types\":[\"应用题\",\"填空\",\"操作题\"]},{\"name\":\"容积与不规则物体体积测量\",\"description\":\"理解容积单位L、mL，掌握利用排水法测量不规则物体体积的方法。\",\"difficulty\":4,\"question_types\":[\"应用题\",\"填空\",\"操作题\"]},{\"name\":\"立体图形涂色与堆叠规律探索\",\"description\":\"通过小正方体堆叠发现三面、两面、一面及无色小正方体的分布规律。\",\"difficulty\":4,\"question_types\":[\"规律探索\",\"填空\",\"选择\"]}],\"examLessonId\":\"g5down-u3-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"长方体和正方体的特征\",\"core_concept\":\"长方体由6个长方形（特殊情况下有两个相对的面是正方形）围成，有12条棱，8个顶点。正方体是特殊的长方体，它的6个面都是完全相同的正方形，12条棱长度相等。\",\"key_formula\":\"长方体棱长总和 $=(a+b+h) \\\\times 4$，正方体棱长总和 $=12a$\",\"common_mistakes\":[\"误以为长方体只有四个面\",\"数棱的个数时重复计算或遗漏\"],\"tips\":\"找家里的火柴盒或魔方观察，记住“面、棱、顶”的数量是6、12、8。\"},{\"point\":\"表面积计算与展开图\",\"core_concept\":\"表面积是物体6个面面积的总和。计算时要根据实际情况确定计算几个面，如鱼缸、粉刷教室等往往只有5个面或4个面。\",\"key_formula\":\"长方体 $S=2(ab+ah+bh)$，正方体 $S=6a^{2}$\",\"common_mistakes\":[\"无盖水箱计算了6个面的面积\",\"计算长方体表面积时漏乘2\"],\"tips\":\"做题前先脑补一下物体长什么样，需不需要计算“底面”和“盖子”。\"},{\"point\":\"体积概念与体积单位换算\",\"core_concept\":\"体积是物体所占空间的大小。常用单位有立方米、立方分米、立方厘米。相邻两个体积单位之间的进率是1000。\",\"key_formula\":\"$$1 \\\\text{m}^{3} = 1000 \\\\text{dm}^{3}$, $1 \\\\text{dm}^{3} = 1000 \\\\text{cm}^{3}$\",\"common_mistakes\":[\"把体积单位进率记成100（混淆面积单位）\",\"单位换算时大变小没用乘法\"],\"tips\":\"记口诀：长度十、面积百、体积千。记单位进率时数清楚有几个“方”。\"},{\"point\":\"长方体和正方体体积公式应用\",\"core_concept\":\"体积的大小由底面积和高决定。通过底面积乘以高可以统一计算长方体和正方体的体积。\",\"key_formula\":\"$$V=abh$ 或 $V=Sh$\",\"common_mistakes\":[\"计算正方体体积时用棱长乘以3（应是三个棱长相乘）\",\"公式应用时单位不统一就直接相乘\"],\"tips\":\"看到底面积和高，直接相乘就是体积！一定要统一单位再计算。\"},{\"point\":\"容积与不规则物体体积测量\",\"core_concept\":\"容积指容器内部空间大小。不规则物体（如石块）丢进水里，上升那部分水的体积就是该物体的体积（排水法）。\",\"key_formula\":\"$$V_{\\\\text{物}} = S_{\\\\text{容}} \\\\times h_{\\\\text{升}}$\",\"common_mistakes\":[\"计算容积时用了外部测量数据\",\"混淆1升水等于1立方厘米（实为1立方分米）\"],\"tips\":\"排水法计算秘籍：物体的体积 = 放入后高度 - 放入前高度 × 底面积。\"},{\"point\":\"立体图形涂色与堆叠规律探索\",\"core_concept\":\"大正方体切开后，三面涂色在顶点，两面涂色在棱中，一面涂色在面中，无涂色在中心。\",\"key_formula\":\"三面涂色：8个；两面涂色：$12(n-2)$；一面涂色：$6(n-2)^{2}$\",\"common_mistakes\":[\"死记硬背公式导致在不同边长时应用错误\",\"忽略了三个面涂色的小正方体数量始终是8（针对标准切割）\"],\"tips\":\"想象切西瓜，最角落的西瓜皮肯定涂色最多，中间的完全没皮。\"}]}]\n"])</script></body></html>
