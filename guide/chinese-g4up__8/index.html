元通过《王戎不取道旁李》，学习文言文的基本翻译技巧。核心在于掌握古今异义词（如“走”在古文中指“跑”）和代词“之”的指代对象。通过王戎观察树在路边而多果实推断果子必苦的逻辑，学习他在日常生活中勤于思考、不随大流、善于观察和冷静分析的优良品质。\",\"key_formula\":\"注释辅助+情境联想=读懂古文意图\",\"common_mistakes\":[\"误认为‘竞走’是现代运动中的竞走项目\",\"分不清‘之’到底是指代王戎还是李子\"],\"tips\":\"朗读时注意停顿，如‘树/在道边/而多子’，并想象王戎站在路边的神态。\"},{\"point\":\"把握文章主要内容的方法\",\"core_concept\":\"掌握“六要素法”（起因、经过、结果）来概括记叙文。对于历史故事，可以先理清人物关系，再通过关键动词串联情节。长文章可以采用“意义段合并法”，即先给文章分段并总结段意，再将各段大意合并成简洁的句子。\",\"key_formula\":\"主要人物+核心事件+最终结果=文章大意\",\"common_mistakes\":[\"概括时过于啰嗦，变成了‘复述’所有细节\",\"遗漏故事的关键起因，导致读者不理解结局\"],\"tips\":\"试着用一两句话告诉别人‘谁发生了什么事，最后一共怎么样’。\"},{\"point\":\"书信的基本格式\",\"core_concept\":\"书信由称呼、问候语、正文、祝福语、署名、日期六部分组成。称呼顶格写，加冒号；问候语另起一行空两格；正文分段写；祝福语分两行写（‘祝你’空两格，‘万事如意’等顶格）；署名和日期写在右下方，署名在上，日期在下。\",\"key_formula\":\"顶格称呼加冒号，落款右下名接时\",\"common_mistakes\":[\"把署名和日期写反了位置\",\"在称呼后面漏写了冒号\"],\"tips\":\"可以记一个口诀：头顶称呼冒号跟，问候祝福不能省，名字日期右下沉。\"},{\"point\":\"人物外貌描写词汇辨析\",\"core_concept\":\"积累描写人物外貌和气质的四字成语。学生需要根据职业、年龄、性格精准使用词汇。如‘威风凛凛’多用于将领兵士，‘文质彬彬’用于书生学者，‘相貌堂堂’用于形容仪表不凡的男子。通过刻画外表，能更好地衬托人物的内心世界。\",\"key_formula\":\"身份地位+外貌特征=精准用词\",\"common_mistakes\":[\"把形容女生的词语（如眉清目秀）误用到粗犷的将军身上\",\"将神态描写（目不转睛）与外貌描写词语混淆\"],\"tips\":\"在脑海中为每个成语匹配一张明星或书本人物的‘脸’进行关联记忆。\"}]}]\n"])</script></body></html>
