xamLessonId\":\"g4down-u5-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"三角形的定义、高与稳定性\",\"core_concept\":\"由三条线段围成（每相邻两条线段的端点相连）的图形叫做三角形。三角形具有稳定性。从三角形的一个顶点到它的对边作一条垂线，顶点和垂足之间的线段叫做三角形的高。\",\"key_formula\":\"三角形具有稳定性，不可变性。\",\"common_mistakes\":[\"画高时没有使用虚线或忘记标垂直符号。\",\"误认为三角形的高只有一条。\"],\"tips\":\"画高要用三角尺的直角边，一条贴着底，另一条对准顶点。\"},{\"point\":\"三角形三边关系定理\",\"core_concept\":\"三角形任意两边的和大于第三边。利用这个定理可以判断三条线段能否组成三角形，也可以求第三边的范围（大于两边之差，小于两边之和）。\",\"key_formula\":\"$$a + b \u003e c, a + c \u003e b, b + c \u003e a$\",\"common_mistakes\":[\"只检查一组边，不注意‘任意’两字。\",\"遇到等腰三角形周长问题时，忽略三边关系判断是否成立。\"],\"tips\":\"快捷方法：找出较短的两条边，只要它们的和大于最长的那条边即可围成。\"},{\"point\":\"三角形的分类\",\"core_concept\":\"按角分：锐角三角形（3个锐角）、直角三角形（1个直角）、钝角三角形（1个钝角）。按边分：不等边三角形、等腰三角形（两腰相等）、等边三角形（三边相等，即正三角形）。\",\"key_formula\":\"等边三角形 \\\\subset 等腰三角形\",\"common_mistakes\":[\"认为等腰三角形不可能是直角三角形。\",\"把等边三角形和等腰三角形的概念混淆。\"],\"tips\":\"记住等边三角形是“三好学生”，三条边相等，三个角也相等（都是60度）。\"},{\"point\":\"三角形的内角和\",\"core_concept\":\"任意一个三角形的三个内角之和都是180度。利用这个结论可以计算三角形中未知角的度数。\",\"key_formula\":\"三角形内角和 = 180^\\\\circ\",\"common_mistakes\":[\"认为大的三角形内角和大，小的三角形内角和小。\",\"等腰三角形计算角度时，忘记有两个底角相等。\"],\"tips\":\"等腰三角形求角：已知顶角求底角用 $(180 - 顶角) \\\\div 2$；已知底角求顶角用 $180 - 底角 \\\\times 2$。\"},{\"point\":\"多边形的内角和探索\",\"core_concept\":\"通过从多边形的一个顶点引出对角线，可以将多边形分割成若干个三角形。多边形内角和等于（边数-2）个三角形内角和的总和。\",\"key_formula\":\"n 边形内角和 = (n - 2) \\\\times 180^\\\\circ\",\"common_mistakes\":[\"公式记错，误记为 $(n-1) \\\\times 180$。\",\"计算较大度数时发生进位或乘法错误。\"],\"tips\":\"记住转化的思想，把不认识的多边形拆成认识的三角形。\"}]}]\n"])</script></body></html>
