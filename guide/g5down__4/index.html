择\",\"排序/比较\"]},{\"name\":\"分数的基本性质\",\"description\":\"理解分子分母同时乘/除以相同数(0除外)大小不变，用于等值分数转化。\",\"difficulty\":2,\"question_types\":[\"填空\",\"选择\",\"判断\"]},{\"name\":\"约分与最大公因数\",\"description\":\"掌握公因数、互质数概念，能利用最大公因数进行约分化简为最简分数。\",\"difficulty\":3,\"question_types\":[\"竖式计算\",\"填空\",\"连线/匹配\"]},{\"name\":\"通分与最小公倍数\",\"description\":\"理解公倍数意义，掌握通分方法以比较异分母分数的大小。\",\"difficulty\":3,\"question_types\":[\"排序/比较\",\"填空\",\"应用题\"]},{\"name\":\"分数和小数的互化\",\"description\":\"掌握小数化分数及分数化小数（除法取近似值）的相互转化技巧。\",\"difficulty\":3,\"question_types\":[\"填空\",\"选择\",\"排序/比较\"]}],\"examLessonId\":\"g5down-u4-exam\",\"examQuestionCount\":15},\"summaries\":[{\"point\":\"分数的产生、意义与单位“1”\",\"core_concept\":\"分数源于测量的需要。一个物体、一些物体都可以看作一个整体，用自然数 1 来表示，通常把它叫做单位“1”。把单位“1”平均分成若干份，表示这样的一份或几份的数叫做分数。其中表示一份的数叫做分数单位。\",\"key_formula\":\"分数 = $\\\\frac{表示的份数}{平均分的总份数}$\",\"common_mistakes\":[\"忽视“平均分”这一前提条件直接写分数\",\"不理解单位“1”可以表示多个物体组成的整体（如一筐苹果）\"],\"tips\":\"确定单位“1”是解题关键，通常在“的”字前面或比字后面。\"},{\"point\":\"分数与除法的关系\",\"core_concept\":\"分数的分子相当于除法中的被除数，分母相当于除数，分数线相当于除号。这种关系可以表示为 $a \\\\div b = \\\\frac{a}{b}$（$b \\\\neq 0$）。要注意分数是一种数，而除法是一种运算。\",\"key_formula\":\"$$被除数 \\\\div 除数 = \\\\frac{被除数}{除数}$\",\"common_mistakes\":[\"颠倒被除数和除数的位置，例如 2 除以 5 写成 5/2\",\"忘记除数（分母）不能为 0\"],\"tips\":\"求“每份是多少”带单位，求“占全长的几分之几”不带单位。\"},{\"point\":\"真分数、假分数与带分数\",\"core_concept\":\"分子比分母小的分数叫做真分数（小于 1）；分子比分母大或分子和分母相等的分数叫做假分数（大于或等于 1）。由整数和真分数合成的数叫做带分数。\",\"key_formula\":\"假分数 $\\\\rightarrow$ 带分数：分子 $\\\\div$ 分母，商为整数部分，余数为分子\",\"common_mistakes\":[\"认为假分数一定大于 1，忽略了等于 1 的情况\",\"将假分数化成带分数时，余数忘记写在分子位置\"],\"tips\":\"分子是分母倍数的假分数可以化成整数。\"},{\"point\":\"分数的基本性质\",\"core_concept\":\"分数的分子和分母同时乘或除以相同的数（0 除外），分数的大小不变。它是约分和通分的理论依据。\",\"key_formula\":\"$$\\\\frac{a}{b} = \\\\frac{a \\\\times c}{b \\\\times c} = \\\\frac{a \\\\div c}{b \\\\div c}$ ($c \\\\neq 0$)\",\"common_mistakes\":[\"分子加（减）一个数，分母也跟着加（减）相同的数\",\"同时乘或除以的数中包含了 0\"],\"tips\":\"记忆口诀：同乘同除不带零，大小不变理最明。\"},{\"point\":\"约分与最大公因数\",\"core_concept\":\"两个数公有的因数叫公因数，其中最大的一个叫最大公因数。把一个分数化成和它相等，但分子分母都比较小的分数叫约分。分子分母互质的分数叫最简分数。\",\"key_formula\":\"约分：$\\\\frac{a}{b} = \\\\frac{a \\\\div 最大公因数}{b \\\\div 最大公因数}$\",\"common_mistakes\":[\"约分没约到最简分数就停止了\",\"找两个数最大公因数时漏掉最大的，只找了小的公因数\"],\"tips\":\"互质数的特征要记牢，如两个连续自然数（0除外）必定互质。\"},{\"point\":\"通分与最小公倍数\",\"core_concept\":\"两个数公有的倍数叫公倍数，其中最小的一个叫最小公倍数。把异分母分数分别化成和原来分数相等的同分母分数，叫做通分。通常取分母的最小公倍数作为公分母。\",\"key_formula\":\"通分：找分母的最小公倍数 $\\\\rightarrow$ 利用基本性质转化\",\"common_mistakes\":[\"通分时只把分母变了，分子忘了根据扩大倍数进行计算\",\"求最小公倍数时与最大公因数的计算方法弄混\"],\"tips\":\"通分主要用于比较大小和异分母分数加减法。\"},{\"point\":\"分数和小数的互化\",\"core_concept\":\"小数化分数：原来有几位小数，就在 1 后面写几个 0 作分母。分数化小数：利用分数与除法的关系，用分子除以分母，除不尽的按要求保留位数。\",\"key_formula\":\"$$\\\\frac{a}{b} = a \\\\div b$\",\"common_mistakes\":[\"分数化小数时分子分母位置颠倒\",\"小数化分数后没有约分成最简分数\"],\"tips\":\"熟记常用分数如 1/2=0.5, 1/4=0.25, 1/8=0.125 等可以提高计算速度。\"}]}]\n"])</script></body></html>
