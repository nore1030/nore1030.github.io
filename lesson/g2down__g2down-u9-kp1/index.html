，即苹果味。判断正确。\"},{\"id\":6,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"有三只小动物：小猫、小狗和小兔。它们分别喜欢吃鱼、骨头和萝卜。已知小猫不喜欢吃萝卜，小狗喜欢吃骨头。请问小猫喜欢吃什么？\",\"options\":[\"鱼\",\"骨头\",\"萝卜\",\"无法确定\"],\"answer\":\"鱼\",\"explanation\":\"喜欢的东西有：鱼、骨头、萝卜。小狗选了骨头，还剩鱼和萝卜。小猫不喜欢萝卜，所以小猫只能选鱼。\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"小红、小丽和小刚三个人的身高各不相同。小红说：“我不是最高的”，小刚说：“我是最矮的”。那谁是最高的？\",\"options\":[\"小红\",\"小丽\",\"小刚\",\"无法确定\"],\"answer\":\"小丽\",\"explanation\":\"小刚最矮。剩下小红和小丽争夺最高。小红说她不是最高的，那么最高的只能是小丽。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"三个小朋友分别出生在上海、北京、广州。小明说“我没去过北京”，小红说“我出生在上海”。小明出生在哪个城市？\",\"options\":[\"北京\",\"上海\",\"广州\",\"武汉\"],\"answer\":\"广州\",\"explanation\":\"小红选了上海。剩下北京和广州。小明没去过北京（没出生在北京），所以小明出生在广州。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"二年级一班参加兴趣小组，明明、亮亮和圆圆分别参加了美术、舞蹈和书法组。明明参加的是美术组，圆圆参加的不是书法组。亮亮参加的是什么组？\",\"options\":[\"美术组\",\"舞蹈组\",\"书法组\",\"围棋组\"],\"answer\":\"书法组\",\"explanation\":\"明明美术组。剩下舞蹈和书法。圆圆不是书法，所以圆圆是舞蹈。最后亮亮只能是书法组。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"已知 A、B、C 是三个不同的数字 1, 2, 3。如果 A=3，B 不是 2，那么 C 是多少？\",\"options\":[\"1\",\"2\",\"3\",\"0\"],\"answer\":\"2\",\"explanation\":\"A=3，剩下 1 和 2。B 不是 2，所以 B=1。那么 C 必须等于 2。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"小明、小华、小东三人中，一人是老师，一人是医生，一人是司机。小明是医生，小华不是老师。谁是老师？\",\"options\":[\"小明\",\"小华\",\"小东\",\"小红\"],\"answer\":\"小东\",\"explanation\":\"小明医生。剩下老师和司机。小华不是老师，小华是司机。所以小东是老师。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"黑兔、白兔、灰兔比赛跳高。黑兔说：“我跳得不是最高的”，白兔说：“我跳得最高”。请问谁跳得最矮？\",\"options\":[\"黑兔\",\"白兔\",\"灰兔\",\"无法确定\"],\"answer\":\"黑兔\",\"explanation\":\"白兔最高。剩下黑兔和灰兔。黑兔说自己不是最高（即为剩余中较矮的一个），所以黑兔最矮。\"},{\"id\":15,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"三个箱子分别装有苹果、橙子和香蕉。1号箱装的是香蕉，2号箱装的不是苹果。3号箱装的是什么？\",\"options\":[\"苹果\",\"橙子\",\"香蕉\",\"西瓜\"],\"answer\":\"苹果\",\"explanation\":\"1号是香蕉。剩下苹果和橙子。2号不是苹果，所以2号是橙子。那么3号只能是苹果。\"},{\"id\":18,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"小青和小蓝分别拿着红色和蓝色的气球。小青说：“我拿的不是红色的。”小蓝拿的是什么颜色的？\",\"options\":[\"红色\",\"蓝色\",\"黄色\",\"绿色\"],\"answer\":\"红色\",\"explanation\":\"只有红蓝两种颜色。小青不是红，那小青是蓝。小蓝就只能是红。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"有 3 个不同的数 5, 8, 9。A 既不是 8 也不是 9，那么 A 是 ___。\",\"options\":[],\"answer\":\"5\",\"explanation\":\"已知可选数字为 5, 8, 9。排除 8 和 9 之后，只剩下 5。故 A = 5。验算：5 不等于 8 且不等于 9 ✓。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"小明、小刚和小红玩猜数游戏，数字是 1, 2, 3。小明猜 1，小红不能猜 1。如果小红猜的不是 2，那么小红只能猜 ___。\",\"options\":[],\"answer\":\"3\",\"explanation\":\"数字有 1, 2, 3。小红不能猜 1（被小明猜了），又不是 2。排除 1 和 2，只剩 3。验算：3 符合不是 1 且不是 2 的条件 ✓。\"},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"$$9 \\times 4 = ?$\",\"options\":[],\"answer\":\"36\",\"explanation\":\"直接应用乘法口诀：四九三十六。$9 \\times 4 = 36$。验算：$36 \\times 4 = 9$ ✓。\"},{\"id\":23,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"简单的逻辑排除法\",\"question\":\"$$45 \\times 0 = ?$\",\"options\":[],\"answer\":\"0\",\"explanation\":\"任何数与 0 相乘都得 0。$45 \\times 0 = 0$。验算：$0 \\times 45 = 0$ ✓。\"}],\"knowledge\":{\"point\":\"简单的逻辑排除法\",\"core_concept\":\"逻辑排除法是指在推理过程中，根据已知的所有条件，依次排除掉不可能的情况，最后剩下的就是正确结论。通常使用“不是……就是……”或“既不是……也不是……”来帮助判断。\",\"key_formula\":\"排除项 + 排除项 \\rightarrow 剩余项\",\"common_mistakes\":[\"在只有三个选项的情况下，排除一个后就立刻下结论，忽略了还有两个可能的选项。\",\"混淆“不是”和“是”的条件，导致推理方向错误。\"],\"tips\":\"做题时可以把所有选项列出来，将不符合的项划掉，剩下的就是答案。\"}},\"chestSlot\":null}]\n"])</script></body></html>
