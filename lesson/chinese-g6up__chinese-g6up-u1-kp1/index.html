破旧的外衣，又开始新的生活；它贪婪地吮吸着春天那清馨、甘甜的露汁。”由这段话你会联想到什么？\",\"options\":[\"勤劳的蜜蜂\",\"破茧成蝶的勇气\",\"落叶归根的凄凉\",\"严冬的寒冷\"],\"answer\":\"破茧成蝶的勇气\",\"explanation\":\"“脱下旧衣”和“新生活”暗示了蜕变过程，联想到破茧成蝶最合适。\"},{\"id\":15,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"联想与想象的阅读策略\",\"question\":\"在《草原》中，“并不茫茫”一词改变了我们对草原的固有印象。这是因为？\",\"options\":[\"草原草长得不多\",\"草原随处可见小丘，绿得有层次感\",\"草原太小了，一眼望得到头\",\"天空没有云朵\"],\"answer\":\"草原随处可见小丘，绿得有层次感\",\"explanation\":\"文中解释因为“到处翠色欲流”，小丘线条柔美，使得色彩丰富不单调，所以不觉得空旷茫茫。\"},{\"id\":21,\"type\":\"matching\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"联想与想象的阅读策略\",\"question\":\"请将文中意象与其象征的意义连接起来。\",\"options\":[\"丁香结\",\"草原\",\"花\",\"月亮\",\"思乡之情\",\"生活忧愁\",\"奉献精神\",\"民族团结\"],\"answer\":\"A-2,B-4,C-3,D-1\",\"explanation\":\"丁香结象征忧愁，草原象征团结，花象征奉献，月亮象征思乡。\"},{\"id\":23,\"type\":\"word_order\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"联想与想象的阅读策略\",\"question\":\"请排列词语，体现通过联想深化阅读的过程。\",\"options\":[\"想开去\",\"阅读时\",\"内容\",\"抓住\",\"再联系生活\"],\"answer\":\"阅读时,抓住,内容,再联系生活,想开去\",\"explanation\":\"这是本单元学习的核心步骤：读内容、联生活、想开去。\"}],\"knowledge\":{\"point\":\"联想与想象的阅读策略\",\"core_concept\":\"阅读时“从所读的内容想开去”，不仅要看进文字，还要由文字产生的画面联想到曾经的亲身经历、看过的书或听过的故事。这能帮我们更深刻地理解作者的情感，化平面文字为立体景观。\",\"key_formula\":\"观察文本内容 + 联系生活经验/相关情境 = 深度阅读感悟\",\"common_mistakes\":[\"只是生搬硬套背景资料，不能与文本中的具体景观建立联系\",\"联想过于离谱，导致理解偏离课文中心思想\"],\"tips\":\"读描写美景的词语时，闭上眼睛想象如果我就在那，会听到什么、看到什么。\"}},\"chestSlot\":null}]\n"])</script></body></html>
