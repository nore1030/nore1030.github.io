"不同的成语对应不同的中心意思，要在习作中准确应用。\"}],\"knowledge\":{\"point\":\"选材的典型性与主旨关联\",\"core_concept\":\"围绕中心意思写，首要任务是学会选材。作者必须根据预设的中心意思，从浩如烟海的生活素材中挑选出最能说明、最能支持这一中心的典型事例。所谓典型事例，是指那些具有代表性、能触动读者的具体事件。如果选材与中心无关，文章就会显得杂乱无章、主旨不明。\",\"key_formula\":\"中心意思 + 典型材料 = 有说服力的文章\",\"common_mistakes\":[\"选材过于笼统，缺乏具体细节\",\"素材与中心意思若即若离，甚至出现负面案例\"],\"tips\":\"写作前可以先在纸上列出3-5个相关材料，逐一对比，剔除掉那些虽然有趣但不能直接证明中心的事件。\"}},\"chestSlot\":null}]\n"])</script></body></html>
