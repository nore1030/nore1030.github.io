\":\"下列字体按照演变先后顺序排列正确的一项是：\",\"options\":[\"甲骨文 金文 小篆 隶书 楷书\",\"甲骨文 隶书 小篆 金文 楷书\",\"小篆 甲骨文 金文 隶书 楷书\",\"金文 甲骨文 小篆 隶书 楷书\"],\"answer\":\"甲骨文 金文 小篆 隶书 楷书\",\"explanation\":\"汉字的演变过程大致为：甲骨文、金文、小篆、隶书、楷书。\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"“一字值千金”中“值”字在字典里的解释有：1.财物价格。2.合算。3.正在。这里应选：\",\"options\":[\"财物价格\",\"合算\",\"正在\",\"价值\"],\"answer\":\"财物价格\",\"explanation\":\"在此句中指汉字的分量重，抵得上千金的价格。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"下列哪个汉字是象形字？\",\"options\":[\"日\",\"樱\",\"闷\",\"武\"],\"answer\":\"日\",\"explanation\":\"“日”模拟的是太阳的形状，属于象形字。\"},{\"id\":9,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"猜字谜：“两个月亮一起挂”。谜底是：\",\"options\":[\"朋\",\"日\",\"明\",\"阴\"],\"answer\":\"朋\",\"explanation\":\"两人为朋，字形由两个“月”组成。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"“门字里面多一点”是什么字？\",\"options\":[\"问\",\"间\",\"闩\",\"闭\"],\"answer\":\"问\",\"explanation\":\"“门”字中间加一个“口”（口在谜语中常用点形容或指代结构），谜底是“问”。\"},{\"id\":12,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"形声字“河”的意符是：\",\"options\":[\"氵\",\"可\",\"丁\",\"口\"],\"answer\":\"氵\",\"explanation\":\"形声字的意符表示含义，三点水表示和水有关。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"仓颉造字的传说是关于汉字产生的：\",\"options\":[\"科学论断\",\"民间故事\",\"考古证据\",\"真实历史\"],\"answer\":\"民间故事\",\"explanation\":\"仓颉造字属于富有文化底蕴的民间神话传说。\"},{\"id\":16,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"我们现在通用的汉字是（___）。\",\"options\":[],\"answer\":\"楷书\",\"explanation\":\"目前我国通用的规范汉字字体是楷书。\"},{\"id\":17,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"传说中创造汉字的人是（___）。\",\"options\":[],\"answer\":\"仓颉\",\"explanation\":\"传说黄帝的史官仓颉观察鸟兽足迹创造了汉字。\"},{\"id\":18,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"“清”和“湖”都是（___）字。\",\"options\":[],\"answer\":\"形声\",\"explanation\":\"这两个字左侧表义，右侧表音，是标准的形声字。\"},{\"id\":19,\"type\":\"matching\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"将下列物品与对应汉字进行连线：\",\"options\":[\"圆圆的月亮\",\"燃烧的火堆\",\"流动的泉水\",\"高耸的山峰\",\"山\",\"月\",\"火\",\"水\"],\"answer\":\"A-2,B-3,C-4,D-1\",\"explanation\":\"象形字源于图形：月亮对应“月”，火堆对应“火”，泉水对应“水”，山峰对应“山”。\"},{\"id\":20,\"type\":\"matching\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"将下列汉字与它们的演变阶段连线：\",\"options\":[\"龟角上的纹路\",\"青铜器上的刻痕\",\"竹简上的蚕头雁尾\",\"宣纸上的工整一捺\",\"金文\",\"隶书\",\"甲骨文\",\"楷书\"],\"answer\":\"A-3,B-1,C-2,D-4\",\"explanation\":\"龟甲对应甲骨文，青铜器对应金文，隶书有蚕头雁尾特点，楷书书写工整。\"},{\"id\":21,\"type\":\"matching\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"将歇后语的前后部分连起来：\",\"options\":[\"外甥打灯笼\",\"隔着门缝看人\",\"咸菜拌豆腐\",\"上鞋不用锥子\",\"把人看扁了\",\"照旧\",\"真好\",\"有言在先\"],\"answer\":\"A-2,B-1,C-4,D-3\",\"explanation\":\"外甥打灯笼—照旧（舅）；隔着门缝看人—把人看扁了；咸菜拌豆腐—有言（盐）在先；上鞋不用锥子—真（针）好。\"},{\"id\":22,\"type\":\"word_order\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"汉字的演变与文化\",\"question\":\"将词语排列成一句赞美汉字的话：\",\"options\":[\"汉字\",\"历史悠久的\",\"祖国的\",\"真是\",\"瑰宝\"],\"answer\":\"祖国的,汉字,真是,历史悠久的,瑰宝\",\"explanation\":\"按照主谓宾结构排列，并正确使用修饰语。\"}],\"knowledge\":{\"point\":\"汉字的演变与文化\",\"core_concept\":\"汉字有几千年的历史，经历从甲骨文、金文、小篆到隶书、楷书的演变过程。汉字不仅仅是交流工具，更蕴含着古人的智慧。汉字有象形、指事、会意、形声等不同的造字规则，通过了解这些规则，我们能更深刻地理解汉字背后的含义和历史感。\",\"key_formula\":\"演变顺序：甲—金—篆—隶—楷\",\"common_mistakes\":[\"混淆隶书和楷书的区别，不清楚蚕头雁尾是隶书的特征\",\"错误判断形声字的声旁和形旁位置\"],\"tips\":\"可以通过拆解字形的方法来记忆，比如看到三点水就知道跟水有关，看到木字旁就知道跟植物有关。\"}},\"chestSlot\":null}]\n"])</script></body></html>
