:5,\"difficulty\":2,\"knowledge_point\":\"常用说明方法的辨析与运用\",\"question\":\"请将句子与其突出运用的说明方法对应：\",\"options\":[\"目前已知最大的鲸。\",\"它的表面温度有五千多度。\",\"它像一把撑开的伞。\",\"比起猫来它更温顺。\",\"列数字\",\"举例子\",\"打比方\",\"作比较\"],\"answer\":\"A-2,B-1,C-3,D-4\",\"explanation\":\"A最大鲸是例子；B五千多度是列数字；C像伞是打比方；D比猫是作比较。\"},{\"id\":20,\"type\":\"matching\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"词语的褒贬义辨析\",\"question\":\"请将反义词组进行连线（情感色彩相反）：\",\"options\":[\"团结\",\"赞扬\",\"忠诚\",\"坚强\",\"诽谤\",\"背叛\",\"软弱\",\"勾结\"],\"answer\":\"A-4,B-1,C-2,D-3\",\"explanation\":\"团结-勾结；赞扬-诽谤；忠诚-背叛；坚强-软弱。\"},{\"id\":22,\"type\":\"word_order\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"说明文的语言风格与条理\",\"question\":\"请通过排序组成一个符合说明文特征的句子：\",\"options\":[\"说明文\",\"真实的\",\"必须给\",\"提供\",\"读者\",\"信息\"],\"answer\":\"说明文,必须给,读者,提供,真实的,信息\",\"explanation\":\"考查对说明文科学性定义的理解。\"}],\"knowledge\":null},\"chestSlot\":null}]\n"])</script></body></html>
