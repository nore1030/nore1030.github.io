强选手已比完。接下来两局你该选什么样的策略？\",\"options\":[\"放弃比赛\",\"用剩下的选手中最强的对对方最弱的\",\"用实力高于对方当场选手的进行比赛\",\"随便选\"],\"answer\":\"用实力高于对方当场选手的进行比赛\",\"explanation\":\"因为要拿剩下的两局，必须保证每局都胜过对手。\"},{\"id\":17,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"沏茶问题（时间安排）\",\"question\":\"小刚洗澡。放满1缸水要12分钟，脱衣服整理要2分钟，洗澡要15分钟。如果放水的过程中可以脱衣服和刷牙（3分钟），他一共要在浴室待多久？\",\"options\":[\"27\",\"29\",\"15\",\"30\"],\"answer\":\"27\",\"explanation\":\"在放水的12分钟内完成脱衣和刷牙。放完水后再洗澡15分钟。$12+15=27$分钟。验算：$12 \u003e 2+3$ ✓。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"烙饼问题（最优策略）\",\"question\":\"用锅烙饼，每面要4分钟，一次只能烙2张。烙2张饼需要 ___ 分钟。\",\"options\":[],\"answer\":\"8\",\"explanation\":\"2张一起放，正反两面。$4 + 4 = 8$分钟。验算：$4 \\\\times 2 = 8$ ✓。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"沏茶问题（时间安排）\",\"question\":\"爸爸要出差。整理衣物8分钟，烧开水15分钟，灌水瓶2分钟。爸爸最快 ___ 分钟后可以出发。\",\"options\":[],\"answer\":\"17\",\"explanation\":\"烧水15分钟（其间可整理衣物）。水烧开后灌水瓶2分钟。$15+2=17$分钟。验算：$15+2=17$且$8\u003c15$ ✓。\"},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"沏茶问题（时间安排）\",\"question\":\"计算：$45 + 5 - 30 = ?$\",\"options\":[],\"answer\":\"20\",\"explanation\":\"$$45 + 5 = 50$, $50 - 30 = 20$。验算：$20 + 30 = 50$ ✓。\"}],\"knowledge\":null},\"chestSlot\":null}]\n"])</script></body></html>
