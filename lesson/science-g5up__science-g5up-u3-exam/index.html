:[\"水位太高了\",\"没有保持供水容器水位恒定\",\"受水容器破了\",\"计时器坏了\"],\"answer\":\"没有保持供水容器水位恒定\",\"explanation\":\"对于泄水型水钟，水位下降会导致水压降低，流速显著变慢。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"时间的换算\",\"question\":\"古代的一昼夜被划分为12个时辰，那么一个时辰相当于现在的（___）个小时。\",\"options\":[],\"answer\":\"2\",\"explanation\":\"24小时除以12个时辰，每个时辰为2小时。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"时间的换算\",\"question\":\"一分钟包含（___）秒。\",\"options\":[],\"answer\":\"60\",\"explanation\":\"时间进率为60制。\"},{\"id\":22,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"水钟的设计与水位控制\",\"question\":\"为了解决水流速度不均匀的问题，古人设计了（___）水钟。\",\"options\":[],\"answer\":\"受水型\",\"explanation\":\"受水型水钟通常配有溢水装置保持水位恒定。\"}],\"knowledge\":null},\"chestSlot\":null}]\n"])</script></body></html>
