助背景资料理解鲁迅作品\",\"question\":\"巴金在《永远不能忘记的事情》中写鲁迅去世时，灵柩上覆盖的一块白布上写着“（___）”。\",\"options\":[],\"answer\":\"民族魂\",\"explanation\":\"这三字不仅是评价，更是鲁迅精神的象征。\"},{\"id\":19,\"type\":\"matching\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"请将闰土童年生活中的趣事进行搭配。\",\"options\":[\"雪地\",\"海边\",\"潮汛\",\"沙地\",\"拾贝壳\",\"捕鸟\",\"刺猹\",\"看跳鱼\"],\"answer\":\"A-2,B-1,C-4,D-3\",\"explanation\":\"雪地捕鸟、海边拾贝壳、潮汛看跳鱼、沙地刺猹是《少年闰土》的核心情节。\"},{\"id\":20,\"type\":\"matching\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"书法的赏析与评价\",\"question\":\"请将书法评价术语与其特征连线。\",\"options\":[\"颜筋\",\"柳骨\",\"笔势\",\"布局\",\"瘦硬有力\",\"丰满有力\",\"章法安排\",\"书写气势\"],\"answer\":\"A-2,B-1,C-4,D-3\",\"explanation\":\"颜筋指丰满，柳骨指瘦硬，笔势指动势，布局指章法。\"},{\"id\":22,\"type\":\"word_order\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"人物刻画的侧面描写与对比\",\"question\":\"根据课文思想，排列出鲁迅对待敌人的态度：\",\"options\":[\"他\",\"横眉冷对\",\"千夫指\",\"哪怕\",\"千难万险\"],\"answer\":\"他,横眉冷对,千夫指,哪怕,千难万险\",\"explanation\":\"突出鲁迅坚定的立场。\"}],\"knowledge\":null},\"chestSlot\":null}]\n"])</script></body></html>
