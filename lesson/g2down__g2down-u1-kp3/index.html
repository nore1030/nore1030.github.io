？\"],\"answer\":\"你最喜欢看什么节目？\",\"explanation\":\"调查目的明确是“最喜欢的电视节目”，所以问题必须围绕“节目种类”展开。\"},{\"id\":12,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"统计表的制作与分析\",\"question\":\"统计表中，第一组 12 人，第二组 11 人，第三组 13 人，第四组 12 人。哪两组人数一样多？\",\"options\":[\"第一组和第二组\",\"第一组和第三组\",\"第一组和第四组\",\"第二组和第四组\"],\"answer\":\"第一组和第四组\",\"explanation\":\"第一组 12 人，第四组 12 人，$12 = 12$，所以这两组人数一样多。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"统计表的制作与分析\",\"question\":\"商店昨天卖出 30 箱牛奶，今天卖出 45 箱，今天比昨天多卖出多少箱？\",\"options\":[\"75\",\"15\",\"10\",\"25\"],\"answer\":\"15\",\"explanation\":\"求比一个数多多少，用减法：$45 - 30 = 15$。验算：$30 + 15 = 45$。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"统计表的制作与分析\",\"question\":\"根据调查，全班有 35 人最喜欢吃肉。已知喜欢吃红烧肉的有 20 人，喜欢吃糖醋排骨的有多少人？（假设只调查了这两样）\",\"options\":[\"55\",\"10\",\"15\",\"25\"],\"answer\":\"15\",\"explanation\":\"用总人数减去其中一部分：$35 - 20 = 15$。验算：$20 + 15 = 35$。\"},{\"id\":15,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"统计表的制作与分析\",\"question\":\"气象小组记录了上个月的天气：晴天 15 天，多云 8 天，剩下的都是雨天。已知上个月有 30 天，雨天有多少天？\",\"options\":[\"23\",\"15\",\"7\",\"5\"],\"answer\":\"7\",\"explanation\":\"先算晴天和多云一共：$15 + 8 = 23$（天），再算雨天：$30 - 23 = 7$（天）。验算：$15 + 8 + 7 = 30$。\"},{\"id\":16,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"统计表的制作与分析\",\"question\":\"统计发现，二(3)班喜欢吃苹果的比喜欢吃香蕉的多 5 人。如果有 2 个同学原本喜欢吃苹果，改成了喜欢吃香蕉，现在两样水果的人数差距是多少？\",\"options\":[\"多 3 人\",\"多 1 人\",\"多 2 人\",\"多 5 人\"],\"answer\":\"多 1 人\",\"explanation\":\"假设原来苹果 10 人，香蕉 5 人（差 5）。苹果减 2 变 8，香蕉加 2 变 7。现在差 $8 - 7 = 1$ 人。\"},{\"id\":17,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"统计表的制作与分析\",\"question\":\"二(1)班有 40 人。在调查最喜欢的颜色时，红色 12 人，黄色 10 人，蓝色 8 人，剩下的喜欢绿色。喜欢绿色的有多少人？\",\"options\":[\"10\",\"30\",\"40\",\"20\"],\"answer\":\"10\",\"explanation\":\"先求前三项总和：$12 + 10 + 8 = 30$。再用全班人数减去 30：$40 - 30 = 10$。验算：$12 + 10 + 8 + 10 = 40$。\"},{\"id\":18,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"统计表的制作与分析\",\"question\":\"调查中发现，想去动物园的有 22 人，想去游乐园的有 18 人。如果想让去两个地方的人数相等，需要从想去动物园的人中调几个人去游乐园？\",\"options\":[\"4\",\"2\",\"1\",\"20\"],\"answer\":\"2\",\"explanation\":\"总人数 $22 + 18 = 40$。相等时每处 $40 \\\\div 2 = 20$。$22 - 20 = 2$。验算：$22 - 2 = 20, 18 + 2 = 20$。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"统计表的制作与分析\",\"question\":\"第一小组有 8 人，第二小组有 9 人，第三小组有 7 人。三个小组一共 ___ 人。\",\"options\":[],\"answer\":\"24\",\"explanation\":\"$$8 + 9 + 7 = 24$。分步：$8 + 9 = 17, 17 + 7 = 24$。验算：$24 - 7 - 9 = 8$。\"},{\"id\":21,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"统计表的制作与分析\",\"question\":\"小明有 15 张卡片，小华有 9 张。小明比小华多 ___ 张卡片。\",\"options\":[],\"answer\":\"6\",\"explanation\":\"$$15 - 9 = 6$。验算：$9 + 6 = 15$。\"},{\"id\":23,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"统计表的制作与分析\",\"question\":\"$$45 - 15 - 10 = ?$\",\"options\":[],\"answer\":\"20\",\"explanation\":\"$$45 - 15 = 30$, $30 - 10 = 20$。验算：$20 + 10 + 15 = 45$。\"}],\"knowledge\":{\"point\":\"统计表的制作与分析\",\"core_concept\":\"将记录的符号（如“正”字）转化为阿拉伯数字，并填入预先设计的表格中，这就是统计表。通过观察统计表，我们可以通过比较数字的大小，一眼看出谁“最多”、谁“最少”，还能进行加减法运算来求“总和”或“差量”，并根据现状做出简单的预测。\",\"key_formula\":\"比较规则：数值大的对应项为最多，数值小的对应项为最少。\",\"common_mistakes\":[\"看错行或列，导致数据填错位置\",\"计算合计人数时出现口算失误\"],\"tips\":\"分析数据时，先用笔圈出最大和最小的数字，这样回答“最多”和“最少”就不会选错了。\"}},\"chestSlot\":null}]\n"])</script></body></html>
