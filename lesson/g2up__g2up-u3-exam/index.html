、钝角的辨析\",\"question\":\"锐角、钝角、直角按从大到小的顺序排列，正确的是：\",\"options\":[\"锐角 \u003e 直角 \u003e 钝角\",\"钝角 \u003e 直角 \u003e 锐角\",\"直角 \u003e 钝角 \u003e 锐角\",\"锐角 \u003e 钝角 \u003e 直角\"],\"answer\":\"钝角 \u003e 直角 \u003e 锐角\",\"explanation\":\"钝角大于 $90^{\\\\circ}$，直角等于 $90^{\\\\circ}$，锐角小于 $90^{\\\\circ}$。所以顺序是钝角、直角、锐角。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"直角、锐角、钝角的辨析\",\"question\":\"钟面上9:30时，分针和时针组成的角是什么角？\",\"options\":[\"锐角\",\"直角\",\"钝角\",\"无法判断\"],\"answer\":\"钝角\",\"explanation\":\"9:30时，分针指着6，时针在9和10之间。它们之间的间隔超过了3大格（3大格是直角），所以是钝角。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"画角与拼角\",\"question\":\"用一副三角尺，不能拼出多少度的角？\",\"options\":[\"75度\",\"105度\",\"20度\",\"150度\"],\"answer\":\"20度\",\"explanation\":\"三角尺角度有 $30, 45, 60, 90$。$30+45=75$，$60+45=105$，$90+60=150$。20度无法通过这些组合拼或减得出。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"角的认识与特征\",\"question\":\"用两条互相垂直的直线，可以组成几个直角？\",\"options\":[\"1个\",\"2个\",\"3个\",\"4个\"],\"answer\":\"4个\",\"explanation\":\"两条直线垂直相交，在交点处会形成四个角，且这四个角都是直角。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"画角与拼角\",\"question\":\"用一个放大 10 倍的放大镜看一个 $30^{\\\\circ}$ 的角，看到的角是多少度？\",\"options\":[\"3度\",\"30度\",\"300度\",\"33度\"],\"answer\":\"30度\",\"explanation\":\"放大镜不改变角度的大小。角度是指张开的幅度，放大时两条边同步变长但开口不变。验算：放大后重叠原角，完全贴合。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"角的认识与特征\",\"question\":\"下面哪个字母中含有的直角最多？\",\"options\":[\"L\",\"T\",\"E\",\"V\"],\"answer\":\"E\",\"explanation\":\"L有1个，T有2个，V是锐角，E有4个直角。4是最大值。\"},{\"id\":16,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"画角与拼角\",\"question\":\"在一个四边形中，最多可以有几个直角？\",\"options\":[\"1个\",\"2个\",\"3个\",\"4个\"],\"answer\":\"4个\",\"explanation\":\"长方形和正方形都有4个直角。根据四边形内角和 $360^{\\\\circ}$，可以达到4个。\"},{\"id\":17,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"直角、锐角、钝角的辨析\",\"question\":\"下面的角中，哪个角最接近直角？\",\"options\":[\"锐角 $10^{\\\\circ}$\",\"钝角 $100^{\\\\circ}$\",\"锐角 $85^{\\\\circ}$\",\"钝角 $150^{\\\\circ}$\"],\"answer\":\"锐角 $85^{\\\\circ}$\",\"explanation\":\"$$|90-10|=80$，$|90-100|=10$，$|90-85|=5$，$|90-150|=60$。5最小，所以 $85^{\\\\circ}$ 最接近。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"角的认识与特征\",\"question\":\"一个三角形剪去一个角，还剩 3 个角，说明是从 ___ 个顶点剪过去的。\",\"options\":[],\"answer\":\"2\",\"explanation\":\"如果剪刀线经过两个顶点，三边形会变成三角形。$3 - 2 + 1 = 2$ 不对，应该是剪掉一个角后剩3个角代表还是三角形，需沿对角线剪。验算：三角形对角剪开还是三角形。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"角的认识与特征\",\"question\":\"正方形有 4 个角，2 个正方形一共有 ___ 个角。\",\"options\":[],\"answer\":\"8\",\"explanation\":\"式子：$4 \\\\times 2 = 8$。验算：$8 \\\\div 2 = 4$ ✓。\"},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"画角与拼角\",\"question\":\"计算：$90 - 30 = ?$\",\"options\":[],\"answer\":\"60\",\"explanation\":\"$$90 - 30 = 60$。验算：$60 + 30 = 90$ ✓。表示直角减去一个 $30^{\\\\circ}$ 锐角得 $60^{\\\\circ}$ 锐角。\"}],\"knowledge\":null},\"chestSlot\":null}]\n"])</script></body></html>
