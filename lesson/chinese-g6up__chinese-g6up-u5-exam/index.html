"knowledge_point\":\"写作中的详略得当\",\"question\":\"为了突出中心，要把重要部分写得（___）。\",\"options\":[],\"answer\":\"详细\",\"explanation\":\"重要部分详写是本单元要求的核心写作技巧。\"},{\"id\":19,\"type\":\"matching\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"选材的典型性与主旨关联\",\"question\":\"将下列课文与其传达的中心意思连线。\",\"options\":[\"《草原》\",\"《盼》\",\"《桥》\",\"《十六年前的回忆》\",\"赞美民族团结\",\"描写童真渴望\",\"歌颂舍己为人\",\"缅怀先烈足迹\"],\"answer\":\"A-1,B-2,C-3,D-4\",\"explanation\":\"每篇课文都有一个明确的中心思想作为灵魂。\"},{\"id\":20,\"type\":\"matching\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"选材的典型性与主旨关联\",\"question\":\"关于题目《迷》，连线不适合选入的逻辑。\",\"options\":[\"书迷\",\"球迷\",\"电脑迷\",\"路人\",\"整天在书店里\",\"电视里只看比赛\",\"掌握很多编程词\",\"在街上迷路了\"],\"answer\":\"A-1,B-2,C-3,D-4\",\"explanation\":\"“迷路”是动词短语，而非作为名词属性的“迷（爱好者）”。\"},{\"id\":22,\"type\":\"word_order\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"习作大纲的构思与拟定\",\"question\":\"将下列表示习作步骤的词语按正确顺序排列：\",\"options\":[\"确定中心\",\"选择材料\",\"编写提纲\",\"动笔起草\"],\"answer\":\"确定中心,选择材料,编写提纲,动笔起草\",\"explanation\":\"这是科学的写作流程，每一步都是为中心服务的。\"}],\"knowledge\":null},\"chestSlot\":null}]\n"])</script></body></html>
