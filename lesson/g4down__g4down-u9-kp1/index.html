swer\":\"5\",\"explanation\":\"假设全是兔：$8 \\\\times 4 = 32$ 只脚。多出 $32 - 22 = 10$ 只脚。鸡：$10 \\\\div (4 - 2) = 5$ 只。验算：$5 \\\\times 2 + 3 \\\\times 4 = 10 + 12 = 22$ ✓。\"},{\"id\":7,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"假设法解决鸡兔同笼问题\",\"question\":\"鸡兔同笼，共有头 30 个，脚 80 只。其中兔有几只？\",\"options\":[\"10\",\"15\",\"20\",\"25\"],\"answer\":\"10\",\"explanation\":\"假设全是鸡：$30 \\\\times 2 = 60$ 只脚。少算了 $80 - 60 = 20$ 只脚。兔：$20 \\\\div 2 = 10$ 只。验算：$10 \\\\times 4 + 20 \\\\times 2 = 80$ ✓。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"假设法解决鸡兔同笼问题\",\"question\":\"小明家养了一些鸡和兔，共有 15 个头，40 只脚。鸡比兔多几只？\",\"options\":[\"1\",\"5\",\"10\",\"15\"],\"answer\":\"5\",\"explanation\":\"假设全是鸡：$15 \\\\times 2 = 30$ 脚。兔：$(40 - 30) \\\\div 2 = 5$ 只。鸡：$15 - 5 = 10$ 只。差值：$10 - 5 = 5$ 只。验算：$10 \\\\times 2 + 5 \\\\times 4 = 40$ ✓。\"},{\"id\":12,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"假设法解决鸡兔同笼问题\",\"question\":\"100 个和尚吃 100 个馒头，大和尚 1 人吃 3 个，小和尚 3 人吃 1 个。大和尚有几个？\",\"options\":[\"20\",\"25\",\"30\",\"35\"],\"answer\":\"25\",\"explanation\":\"假设全是小和尚：$100 \\\\div 3 = 33 \\\\frac{1}{3}$（不便计算）。假设全是大和尚：脚（馒头）总数 300。多出 $300 - 100 = 200$。大转小：每大换小差值为 $3 - \\\\frac{1}{3} = \\\\frac{8}{3}$。小：$200 \\\\div (8/3) = 75$。大：$100 - 75 = 25$。验算：$25 \\\\times 3 + 75 \\\\div 3 = 75 + 25 = 100$ ✓。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"假设法解决鸡兔同笼问题\",\"question\":\"《孙子算经》中记载：“今有雉兔同笼，上有三十五头，下有九十四足”。这里“雉”指的是什么？\",\"options\":[\"猪\",\"大象\",\"野鸡\",\"蛇\"],\"answer\":\"野鸡\",\"explanation\":\"《孙子算经》中的“雉”在古代汉语中指野鸡。选：野鸡。\"},{\"id\":15,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"假设法解决鸡兔同笼问题\",\"question\":\"如果有 10 只兔和 10 只鸡，它们一共有多少条腿？\",\"options\":[\"40\",\"50\",\"60\",\"70\"],\"answer\":\"60\",\"explanation\":\"兔脚：$10 \\\\times 4 = 40$。鸡脚：$10 \\\\times 2 = 20$。总数：$40 + 20 = 60$。验算：$60 - 40 = 20$ ✓。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"假设法解决鸡兔同笼问题\",\"question\":\"笼子里有鸡和兔各 5 只，一共有 ___ 只脚。\",\"options\":[],\"answer\":\"30\",\"explanation\":\"鸡脚 $5 \\\\times 2 = 10$，兔脚 $5 \\\\times 4 = 20$。$10 + 20 = 30$。验算：$30 - 10 = 20$ ✓。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"假设法解决鸡兔同笼问题\",\"question\":\"鸡兔同笼，头 20，脚 56。兔有 ___ 只。\",\"options\":[],\"answer\":\"8\",\"explanation\":\"假设全鸡：$20 \\\\times 2 = 40$。兔：$(56 - 40) \\\\div 2 = 8$。验算：$8 \\\\times 4 + 12 \\\\times 2 = 32 + 24 = 56$ ✓。\"},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"假设法解决鸡兔同笼问题\",\"question\":\"计算：$(48 - 10 \\\\times 2) \\\\div (4 - 2) = ?$\",\"options\":[],\"answer\":\"14\",\"explanation\":\"先算括号内：$48 - 20 = 28$；再算除法：$28 \\\\div 2 = 14$。验算：$14 \\\\times 2 + 20 = 48$ ✓。\"},{\"id\":23,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"假设法解决鸡兔同笼问题\",\"question\":\"计算：$35 \\\\times 4 - 94 = ?$\",\"options\":[],\"answer\":\"46\",\"explanation\":\"$$140 - 94 = 46$。验算：$46 + 94 = 140$ ✓。\"}],\"knowledge\":{\"point\":\"假设法解决鸡兔同笼问题\",\"core_concept\":\"假设法是解决此类问题的核心。基本思路是先假设笼子里全部是其中的一种动物（如全是鸡），计算出假设情况下的总腿数，再与实际的总腿数进行对比。由于一只兔比一只鸡多 2 条腿，通过腿数之差除以 2，就能算出兔的只数。\",\"key_formula\":\"$$兔子数 = (总脚数 - 总头数 \\\\times 2) \\\\div (4 - 2)$\",\"common_mistakes\":[\"计算差量时单位不统一或找错对应关系。\",\"得出结果后不带入原题进行头数和脚数的二次验证。\"],\"tips\":\"记住‘假鸡得兔，假兔得鸡’。即假设全是鸡，算出来的是兔子的数量。\"}},\"chestSlot\":null}]\n"])</script></body></html>
