熊猫多 30 只。熊猫有多少只？\",\"options\":[\"10\",\"15\",\"8\",\"12\"],\"answer\":\"10\",\"explanation\":\"设熊猫 $x$ 只，则猴子 $4x$ 只。$4x - x = 30$，$3x = 30$，$x = 10$。\"},{\"id\":17,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"用字母表示数与简写规则\",\"question\":\"一个两位数，十位上的数字是 $a$，个位上的数字是 $b$。这个两位数是（    ）。\",\"options\":[\"ab\",\"a+b\",\"10a+b\",\"10b+a\"],\"answer\":\"10a+b\",\"explanation\":\"十位上的数字表示几个十，所以是 $10a$，加上个位是 $10a+b$。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"解简易方程\",\"question\":\"已知 $2x + 7 = 37$，那么 $x$ 的值是 ___。\",\"options\":[],\"answer\":\"15\",\"explanation\":\"$$2x = 37 - 7 = 30$。$x = 30 \\\\div 2 = 15$。验算：$2 \\\\times 15 + 7 = 37$。正确。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"用字母表示数与简写规则\",\"question\":\"小红有 20 元钱，买了 $n$ 支单价为 3 元的铅笔，还剩 ___ 元。（用含有字母的式子表示，填入 $20-3n$ 中的数字 3 后的字母前面的数字）\",\"options\":[],\"answer\":\"3\",\"explanation\":\"虽然是字母题，但要求填固定数字。此处考查式子结构 $20 - 3n$ 中的 3。总价 = 单价 $\\\\times$ 数量。\"},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"解简易方程\",\"question\":\"计算方程的解：$5x - 13 = 27, x = ?$\",\"options\":[],\"answer\":\"8\",\"explanation\":\"$$5x = 27 + 13 = 40$。$x = 40 \\\\div 5 = 8$。验算：$5 \\\\times 8 - 13 = 40 - 13 = 27$。正确。\"}],\"knowledge\":null},\"chestSlot\":null}]\n"])</script></body></html>
