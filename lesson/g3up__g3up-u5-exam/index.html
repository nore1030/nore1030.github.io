:\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"求一个数的几倍是多少\",\"question\":\"有 10 个圆，三角形是个数的 3 倍多 2 个，三角形有多少个？\",\"options\":[\"30\",\"32\",\"28\",\"35\"],\"answer\":\"32\",\"explanation\":\"先算 3 倍：$10 \\\\times 3 = 30$。再加 2：$30 + 2 = 32$。\"},{\"id\":17,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"求一个数的几倍是多少\",\"question\":\"一双袜子 4 元，一双鞋的价钱是袜子的 9 倍。买一双鞋要多少钱？\",\"options\":[\"13 元\",\"36 元\",\"40 元\",\"5 元\"],\"answer\":\"36 元\",\"explanation\":\"$$4 \\\\times 9 = 36$。验算：$36 \\\\div 4 = 9$。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"求一个数的几倍是多少\",\"question\":\"一盆花有 5 朵，4 盆花共有 ___ 朵。\",\"options\":[],\"answer\":\"20\",\"explanation\":\"求 5 的 4 倍。$5 \\\\times 4 = 20$。验算：$20 \\\\div 5 = 4$。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"求一个数是另一个数的几倍\",\"question\":\"小蚂蚁搬了 18 粒米，大蚂蚁搬了 6 粒米，小蚂蚁搬的是大蚂蚁的 ___ 倍。\",\"options\":[],\"answer\":\"3\",\"explanation\":\"求 18 是 6 的几倍。$18 \\\\div 6 = 3$。验算：$6 \\\\times 3 = 18$。\"},{\"id\":22,\"type\":\"calculation\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"求一个数的几倍是多少\",\"question\":\"计算：$7 \\\\times 3 = ?$\",\"options\":[],\"answer\":\"21\",\"explanation\":\"$$7 \\\\times 3 = 21$。验算：$21 \\\\div 3 = 7$。\"}],\"knowledge\":null},\"chestSlot\":null}]\n"])</script></body></html>
