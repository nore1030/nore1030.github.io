ice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"工程建设的步骤与特点\",\"question\":\"“明确工程要解决的问题”属于工程建设的第几个阶段？\",\"options\":[\"第一阶段\",\"第二阶段\",\"第三阶段\",\"第四阶段\"],\"answer\":\"第一阶段\",\"explanation\":\"工程的第一步是明确任务，了解目标和限制条件。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"塔台模型的设计与制作\",\"question\":\"用吸管搭建框架时，最稳定的基本图形是？\",\"options\":[\"梯形\",\"平行四边形\",\"正方形\",\"三角形\"],\"answer\":\"三角形\",\"explanation\":\"三角形的三边长度确定后，形状就固定了，具有稳定性。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"工程模型的测试、评估与改进\",\"question\":\"当小组的塔台模型测试成绩不理想时，应该采取的态度是？\",\"options\":[\"把模型拆了不做了\",\"反思设计中的问题并进行优化\",\"修改测试数据使之合格\",\"埋怨队友配合不好\"],\"answer\":\"反思设计中的问题并进行优化\",\"explanation\":\"失败和问题是改进设计的契机，也是工程师成长的必经之路。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"工程模型的测试、评估与改进\",\"question\":\"在项目评估中，如果小组为了省钱而使用了较少的吸管导致坍塌，这说明？\",\"options\":[\"成本控制得很好\",\"平衡成本与安全的关系处理不当\",\"应该完全不计成本\",\"这种吸管质量不行\"],\"answer\":\"平衡成本与安全的关系处理不当\",\"explanation\":\"工程需要在安全、性能、成本之间寻找最佳平衡点。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"工程建设的步骤与特点\",\"question\":\"在工程实践中，科学家和工程师经常会建立模型，其主要目的是？\",\"options\":[\"为了好玩\",\"向别人展示漂亮的作品\",\"测试设计和发现潜在问题\",\"直接当作最终成品使用\"],\"answer\":\"测试设计和发现潜在问题\",\"explanation\":\"模型测试是验证设计可行性的低成本且高效的方法。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"塔台模型的设计与制作\",\"question\":\"在制作吸管模型中，胶带过量使用会导致？\",\"options\":[\"模型更好看了\",\"增加结构负荷且浪费成本\",\"模型一定会更稳\",\"没有负面影响\"],\"answer\":\"增加结构负荷且浪费成本\",\"explanation\":\"过度缠绕胶带会增加自重并增加材料成本，不一定是好的设计。\"},{\"id\":16,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"工程建设的步骤与特点\",\"question\":\"下列建筑中，不属于大型工程的是？\",\"options\":[\"学校的教学楼\",\"胡同里的临时棚子\",\"跨海大桥\",\"水立方游泳馆\"],\"answer\":\"胡同里的临时棚子\",\"explanation\":\"工程通常具有明确的设计、施工和长期的使用需求，而临时简易搭建不算严格意义上的工程。\"},{\"id\":17,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"塔台模型的设计与制作\",\"question\":\"为了使塔台更稳固，不倒翁原理给我们的启示是？\",\"options\":[\"把塔台做成圆形\",\"顶部要用重物填满\",\"底部做得重一些，重心降低\",\"尽量不接触地面\"],\"answer\":\"底部做得重一些，重心降低\",\"explanation\":\"上轻下重、重心低是物体稳固的重要条件。\"},{\"id\":19,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"塔台模型的设计与制作\",\"question\":\"在制作高60厘米的塔台模型时，如果实际高度只有58厘米，在评价表中这一项得（___）分（假设满分3分，每差1厘米扣1分）。\",\"options\":[],\"answer\":\"1\",\"explanation\":\"高度每差1cm扣1分，差2cm扣2分，剩余1分。\"},{\"id\":20,\"type\":\"fill_blank\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"住房的结构与系统\",\"question\":\"一套普通住房通常包含卧室、客厅、厨房、卫生间等（___）个及以上的独立功能区。\",\"options\":[],\"answer\":\"4\",\"explanation\":\"基础住宅一般由这四个核心区域构成。\"},{\"id\":22,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"工程建设的步骤与特点\",\"question\":\"工程设计的核心是（___）技术，通过技术手段解决实际生活中的难题。\",\"options\":[],\"answer\":\"核心\",\"explanation\":\"工程与技术相辅相成，核心技术是工程成功的关键。\"}],\"knowledge\":null},\"chestSlot\":null}]\n"])</script></body></html>
