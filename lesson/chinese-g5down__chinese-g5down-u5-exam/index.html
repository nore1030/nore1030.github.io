wledge_point\":\"侧面描写与烘托\",\"question\":\"读句子：“曹小三发现师傅衣服上居然有一个白点，心猛地往下一沉。”这里的描写是为了：\",\"options\":[\"说明师傅手艺退步了\",\"说明曹小三眼神太好\",\"为后文的转折制造悬念\",\"表现曹小三很顽皮\"],\"answer\":\"为后文的转折制造悬念\",\"explanation\":\"白点的出现是一个转折点，增强了故事的趣味性。\"},{\"id\":8,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"选用典型事例表现人物\",\"question\":\"要描写“爸爸是个体育迷”，以下哪组素材最不恰当？\",\"options\":[\"凌晨起床看球赛\",\"给孩子买漂亮的运动鞋\",\"跑步时忘记了回家吃饭\",\"能记得近十年的奥运冠军\"],\"answer\":\"给孩子买漂亮的运动鞋\",\"explanation\":\"买鞋可能是因为爱孩子，并不一定能直接反映出他本人是体育迷。\"},{\"id\":10,\"type\":\"choice\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"人物描写的基本方法\",\"question\":\"“刷子李”给自己定的规矩中，最奇特的一条是：\",\"options\":[\"刷墙时穿一身黑\",\"一天只刷一间房\",\"刷墙时不许徒弟说话\",\"刷墙收费特别贵\"],\"answer\":\"刷墙时穿一身黑\",\"explanation\":\"重点在于如果黑衣服上沾了白点，就不收钱。这是他自信的体现。\"},{\"id\":11,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"人物描写的基本方法\",\"question\":\"下列属于神态描写的是：\",\"options\":[\"他穿着一件破旧的大衣\",\"他愤怒地盯着那个坏人\",\"他一个箭步冲了上去\",\"他低声说了一句对不起\"],\"answer\":\"他愤怒地盯着那个坏人\",\"explanation\":\"愤怒和盯着的眼神构成了神态。\"},{\"id\":13,\"type\":\"choice\",\"score\":5,\"difficulty\":3,\"knowledge_point\":\"人物描写的基本方法\",\"question\":\"阅读：“他在屋里走来走去，手不停地搓着，眉头皱成了疙瘩。”这段话主要刻画了人物：\",\"options\":[\"犹豫不决的神情\",\"非常有钱的样子\",\"非常生病的症状\",\"正在偷听的动作\"],\"answer\":\"犹豫不决的神情\",\"explanation\":\"走来走去、搓手、皱眉是内心焦急、纠结的外部表现。\"},{\"id\":14,\"type\":\"choice\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"人物描写的基本方法\",\"question\":\"形容一个人说话像连珠炮，这是形容这个人的？\",\"options\":[\"语言速度极快\",\"长得像炮弹\",\"喜欢开玩笑\",\"声音很好听\"],\"answer\":\"语言速度极快\",\"explanation\":\"这是一种生动的比喻，形容说话密集且迅速。\"},{\"id\":16,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"个人描写方法\",\"question\":\"在《摔跤》一文中，我们可以看出嘎子骨子里带着一股（___）劲儿。\",\"options\":[],\"answer\":\"不服输\",\"explanation\":\"嘎子虽输但不放弃，充满了韧性。\"},{\"id\":17,\"type\":\"fill_blank_text\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"侧面描写与烘托\",\"question\":\"描写周围人的惊叹是为了（___）主人公的高超技艺。\",\"options\":[],\"answer\":\"烘托\",\"explanation\":\"烘托是侧面描写的主要作用。\"},{\"id\":19,\"type\":\"matching\",\"score\":5,\"difficulty\":1,\"knowledge_point\":\"人物描写的基本方法\",\"question\":\"将描写词语与对应的人物特征连线。\",\"options\":[\"手疾眼快\",\"一丝不苟\",\"半信半疑\",\"挺脱活泼\",\"刷子李工作\",\"嘎子动作\",\"祥子外貌\",\"曹小三心态\"],\"answer\":\"A-2,B-1,C-4,D-3\",\"explanation\":\"嘎子动作快，刷子李态度严谨，曹小三起疑心，祥子（本册相关人物）挺脱。\"},{\"id\":20,\"type\":\"matching\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"人物描写的基本方法\",\"question\":\"将下列课文中的描写与其所属类别连线。\",\"options\":[\"赵氏插手道...\",\"头飞快地摇...\",\"两根灯草...\",\"平平整整...\",\"动作\",\"语言\",\"细节物象\",\"环境\"],\"answer\":\"A-2,B-1,C-3,D-4\",\"explanation\":\"说出的词是语言，摇头是动作，灯草是关键物品细节，涂匀后的平整状是环境结果。\"},{\"id\":22,\"type\":\"word_order\",\"score\":5,\"difficulty\":2,\"knowledge_point\":\"人物描写的基本方法\",\"question\":\"请将描写嘎子心理的词语排成句：\",\"options\":[\"小嘎子\",\"自以为\",\"推拉拽顶\",\"能战胜\",\"胖墩儿\"],\"answer\":\"小嘎子,自以为,推拉拽顶,能战胜,胖墩儿\",\"explanation\":\"反映出嘎子的心理状态与动作企图。\"}],\"knowledge\":null},\"chestSlot\":null}]\n"])</script></body></html>
